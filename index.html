<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>לא נכון נכון!</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#FFD400;
text-align:center;
color:#111;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{
font-size:50px;
margin-bottom:10px;
}

.scoreboard{
display:flex;
justify-content:center;
gap:30px;
font-size:24px;
font-weight:bold;
margin-bottom:20px;
}

#gameTimer{
font-size:38px;
font-weight:bold;
margin-bottom:20px;
}

#question{
background:white;
border-radius:20px;
padding:25px;
font-size:32px;
font-weight:bold;
min-height:90px;
display:flex;
justify-content:center;
align-items:center;
max-width:700px;
margin:auto;
}

#countdown{
font-size:80px;
font-weight:bold;
margin:20px;
}

button{
border:none;
border-radius:15px;
padding:15px 30px;
font-size:24px;
cursor:pointer;
margin:10px;
}

.start{
background:#111;
color:white;
}

.success{
background:#4CAF50;
color:white;
}

.fail{
background:#F44336;
color:white;
}

#controls{
display:none;
}

#summary{
display:none;
background:white;
border-radius:20px;
padding:25px;
margin-top:20px;
}

@media(max-width:600px){

h1{
font-size:34px;
}

#question{
font-size:24px;
}

#countdown{
font-size:55px;
}

button{
font-size:18px;
padding:12px 20px;
}

.scoreboard{
font-size:18px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>🤪 לא נכון נכון!</h1>

<div class="scoreboard">
<div>🏆 הצליחו: <span id="success">0</span></div>
<div>❌ נפסלו: <span id="fail">0</span></div>
</div>

<div id="gameTimer">⏱️ 01:00</div>

<button id="startBtn" class="start" onclick="startGame()">
🚀 התחל משחק
</button>

<div id="question">
לחצו על התחל משחק
</div>

<div id="countdown"></div>

<div id="controls">
<button class="success" onclick="markSuccess()">
✅ הצליחו
</button>

<button class="fail" onclick="markFail()">
❌ נפסלו
</button>
</div>

<div id="summary">

<h2>🏁 המשחק הסתיים!</h2>

<p>🏆 הצליחו: <span id="finalSuccess"></span></p>

<p>❌ נפסלו: <span id="finalFail"></span></p>

<p>🎯 סך הכול שאלות: <span id="finalTotal"></span></p>

<button class="start" onclick="location.reload()">
🔄 שחקו שוב
</button>

</div>

</div>

<script>

const questions = [

"מה נותנת פרה?",
"איפה גרים דגים?",
"מה צבע השמש?",
"כמה ימים יש בשבוע?",
"מה אוכלים בבוקר?",
"מה עושה רופא?",
"מה עושה שוטר?",
"מה צבע הדשא?",
"מה יש בים?",
"מה יש במקרר?",
"מה עושים במיטה?",
"מה יש בשמיים?",
"מה עושה מורה?",
"מה צבע בננה?",
"מה אוכלת פרה?",
"מה יש בסופר?",
"מה עושים עם מטרייה?",
"מה עושים עם טלפון?",
"מה צבע עגבנייה?",
"מה יש בגן חיות?",
"מה עושה טבח?",
"מה יש בכיתה?",
"מה עושים במטבח?",
"מה עושה נהג?",
"מה יש בחוף הים?",
"מה צבע השלג?",
"מה עושים במקלחת?",
"מה יש בבית חולים?",
"מה עושה טייס?",
"מה צבע הים?",
"מה עושים עם מחשב?",
"מה יש בפארק?",
"מה צבע תפוז?",
"מה עושים עם כדור?",
"מה יש בספרייה?",
"מה צבע עננים?",
"מה עושה כבאי?",
"מה יש ביער?",
"מה עושה זמר?",
"מה יש על עץ?",
"מה עושים עם אופניים?",
"מה יש בבית ספר?",
"מה צבע הלימון?",
"מה עושים עם מברשת שיניים?",
"מה יש במטוס?",
"מה עושה חקלאי?",
"מה יש בתחנת דלק?",
"מה עושים עם מזלג?",
"מה יש במגרש כדורגל?",
"מה צבע הענבים?"

];

let success = 0;
let fail = 0;

let shuffledQuestions = [];
let currentQuestion = 0;

let gameTime = 60;
let gameInterval;

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;
}

function startGame(){

document.getElementById("startBtn").style.display="none";

document.getElementById("controls").style.display="block";

shuffledQuestions =
shuffleArray([...questions]);

showQuestion();

gameInterval = setInterval(()=>{

gameTime--;

let minutes =
Math.floor(gameTime/60);

let seconds =
gameTime%60;

document.getElementById("gameTimer").innerHTML =
`⏱️ ${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;

if(gameTime<=0){

endGame();

}

},1000);

}

function showQuestion(){

if(currentQuestion>=shuffledQuestions.length){

shuffledQuestions =
shuffleArray([...questions]);

currentQuestion=0;

}

document.getElementById("question").innerHTML =
shuffledQuestions[currentQuestion];

currentQuestion++;

let count=3;

document.getElementById("countdown").innerHTML =
count;

const timer =
setInterval(()=>{

count--;

if(count>0){

document.getElementById("countdown").innerHTML =
count;

}else{

document.getElementById("countdown").innerHTML =
"⏰";

clearInterval(timer);

}

},1000);

}

function markSuccess(){

success++;

document.getElementById("success").innerText =
success;

showQuestion();

}

function markFail(){

fail++;

document.getElementById("fail").innerText =
fail;

showQuestion();

}

function endGame(){

clearInterval(gameInterval);

document.getElementById("controls").style.display =
"none";

document.getElementById("question").style.display =
"none";

document.getElementById("countdown").style.display =
"none";

document.getElementById("summary").style.display =
"block";

document.getElementById("finalSuccess").innerText =
success;

document.getElementById("finalFail").innerText =
fail;

document.getElementById("finalTotal").innerText =
success+fail;

}

</script>

</body>
</html>
